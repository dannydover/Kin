name: Friend readiness diagnostic (nonshipping)
on:
  push:
    branches: [diagnostic/kin13-friend-readiness-fields]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          test "$(uname -m)" = arm64
      - name: Create isolated simulator
        run: |
          KIN_CI_SIMULATOR=$(xcrun simctl create "Kin friend diagnostic ${GITHUB_RUN_ID}" com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "KIN_CI_SIMULATOR=$KIN_CI_SIMULATOR" >> "$GITHUB_ENV"
          xcrun simctl boot "$KIN_CI_SIMULATOR"
          xcrun simctl bootstatus "$KIN_CI_SIMULATOR" -b
      - name: Run original cold-launch smoke
        timeout-minutes: 45
        run: |
          xcodebuild -project Kin.xcodeproj -scheme Kin -destination "platform=iOS Simulator,id=$KIN_CI_SIMULATOR" -derivedDataPath DerivedData -resultBundlePath "$RUNNER_TEMP/KinTests.xcresult" -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 600 -only-testing:KinUITests/KinUITests/testNormalColdLaunchOpensNotebookAndPreservesSavedPerson clean test CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/friend-raw.log" 2>&1
      - name: Verify finalized targeted identity and result
        if: always()
        run: |
          test -d "$RUNNER_TEMP/KinTests.xcresult"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/KinTests.xcresult" > "$RUNNER_TEMP/KinTests-summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/KinTests.xcresult" > "$RUNNER_TEMP/KinTests-test-tree.json"
          python3 scripts/check-test-results.py "$RUNNER_TEMP/KinTests-summary.json"
          python3 -c 'import importlib.util,json,os; s=importlib.util.spec_from_file_location("m","scripts/ci-test-shards.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.verify_test_ids(json.load(open(os.environ["RUNNER_TEMP"]+"/KinTests-test-tree.json")),["KinUITests/KinUITests/testNormalColdLaunchOpensNotebookAndPreservesSavedPerson"])'
      - name: Package finalized or partial synthetic result
        if: always()
        run: python3 scripts/ci-retain.py
      - name: Retain synthetic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kin-friend-readiness-result
          path: ${{ runner.temp }}/KinCI-retained/
          retention-days: 7
          if-no-files-found: error
      - name: Remove isolated simulator
        if: always()
        run: |
          if [ -n "${KIN_CI_SIMULATOR:-}" ]; then python3 scripts/ci-simulator.py cleanup; fi
      - name: Retain simulator cleanup
        if: always() && env.KIN_CI_SIMULATOR != ''
        uses: actions/upload-artifact@v4
        with:
          name: kin-friend-readiness-cleanup
          path: ${{ runner.temp }}/KinTests-cleanup.json
          retention-days: 7
          if-no-files-found: error
