name: Synthetic import-review switch diagnostic (nonshipping)
on:
  push:
    branches: [diagnostic/kin13-review-toggle]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe one original synthetic test
        timeout-minutes: 40
        run: python3 scripts/diagnose-contact-toggle.py
      - name: Retain sanitized result and events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-review-toggle-diagnostic
          path: ${{ runner.temp }}/KinControlDiagnostic/public/
          retention-days: 7
          if-no-files-found: error
