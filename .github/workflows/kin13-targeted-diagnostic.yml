name: Synthetic Contacts and Clear diagnostic (nonshipping)
on:
  push:
    branches: [diagnostic/kin13-search-readiness]
permissions:
  contents: read
jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        case: [contacts, clear]
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          test "$(uname -m)" = arm64
      - name: Prepare fresh synthetic simulator
        run: |
          KIN_CI_SIMULATOR=$(xcrun simctl create "Kin targeted ${GITHUB_RUN_ID}" com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "KIN_CI_SIMULATOR=$KIN_CI_SIMULATOR" >> "$GITHUB_ENV"
          export KIN_CI_SIMULATOR
          xcrun simctl boot "$KIN_CI_SIMULATOR"
          xcrun simctl bootstatus "$KIN_CI_SIMULATOR" -b
          python3 scripts/ci-simulator.py grant
          python3 scripts/create-simulator-photo.py "$RUNNER_TEMP/KinSyntheticPhoto.png"
          xcrun simctl addmedia "$KIN_CI_SIMULATOR" "$RUNNER_TEMP/KinSyntheticPhoto.png"
      - name: Execute original targeted tests
        timeout-minutes: 45
        run: |
          if [ "${{ matrix.case }}" = contacts ]; then
            selection=(-only-testing:KinUITests/ExistingContactPreservationUITests/testExistingBirthInformationSurvivesMissingAndYearlessContactsReview -only-testing:KinUITests/KinUITests/testContactMissingBirthdayPromptCancellationAndEstimatedImport)
          else
            selection=(-only-testing:KinUITests/IndexMembershipUITests/testClearEmptyCategoryRestoresPeopleWithoutChangingRecords)
          fi
          xcodebuild -project Kin.xcodeproj -scheme Kin -destination "platform=iOS Simulator,id=$KIN_CI_SIMULATOR" -derivedDataPath DerivedData -resultBundlePath "$RUNNER_TEMP/KinTests.xcresult" -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 600 "${selection[@]}" clean test CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/targeted-raw.log" 2>&1
      - name: Verify finalized test identities and results
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/KinTests.xcresult" > "$RUNNER_TEMP/KinTests-summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/KinTests.xcresult" > "$RUNNER_TEMP/KinTests-test-tree.json"
          python3 scripts/check-test-results.py "$RUNNER_TEMP/KinTests-summary.json"
          CASE="${{ matrix.case }}" python3 -c 'import importlib.util,json,os; s=importlib.util.spec_from_file_location("m","scripts/ci-test-shards.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); ids={"contacts":["KinUITests/ExistingContactPreservationUITests/testExistingBirthInformationSurvivesMissingAndYearlessContactsReview","KinUITests/KinUITests/testContactMissingBirthdayPromptCancellationAndEstimatedImport"],"clear":["KinUITests/IndexMembershipUITests/testClearEmptyCategoryRestoresPeopleWithoutChangingRecords"]}; m.verify_test_ids(json.load(open(os.environ["RUNNER_TEMP"]+"/KinTests-test-tree.json")),ids[os.environ["CASE"]])'
      - name: Package finalized or partial evidence
        if: always()
        run: python3 scripts/ci-retain.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kin-targeted-${{ matrix.case }}
          path: ${{ runner.temp }}/KinCI-retained/
          retention-days: 7
          if-no-files-found: error
      - name: Remove synthetic simulator
        if: always()
        run: |
          if [ -n "${KIN_CI_SIMULATOR:-}" ]; then python3 scripts/ci-simulator.py cleanup; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kin-targeted-cleanup-${{ matrix.case }}
          path: ${{ runner.temp }}/KinTests-cleanup.json
          retention-days: 7
          if-no-files-found: warn
