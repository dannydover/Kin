name: Unsigned archive exercise
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  # Separate, PR-only unsigned archive exercise; never signs or contacts Apple.
  unsigned-archive-exercise:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/kin-1.3-unsigned-archive' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify archive toolchain
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          xcrun swift --version | grep -F 'Apple Swift version 6.4'
          test "$(uname -m)" = arm64
      - name: Create unsigned archive in ephemeral runner storage
        run: |
          xcodebuild -project Kin.xcodeproj -scheme Kin \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/KinArchiveDerivedData" \
            -archivePath "$RUNNER_TEMP/KinUnsigned.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO DEPLOYMENT_POSTPROCESSING=YES \
            STRIP_INSTALLED_PRODUCT=YES STRIP_STYLE=debugging \
            > "$RUNNER_TEMP/KinUnsigned-build.log" 2>&1 || {
              echo 'Unsigned archive build failed; raw log remains ephemeral.' >&2
              exit 1
            }
      - name: Verify archive and prepare sanitized provenance
        run: python3 scripts/verify-unsigned-archive.py "$RUNNER_TEMP/KinUnsigned.xcarchive" "$RUNNER_TEMP/KinUnsigned-manifest.json"
      - name: Retain only sanitized provenance
        uses: actions/upload-artifact@v4
        with:
          name: kin-unsigned-archive-provenance
          path: ${{ runner.temp }}/KinUnsigned-manifest.json
          retention-days: 7
          if-no-files-found: error
