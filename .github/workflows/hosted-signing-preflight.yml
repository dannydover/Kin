name: Read-only hosted signing preflight
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit SHA to inspect
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SOURCE_SHA: ${{ inputs.source_sha }}
      CONTEXT_SHA: ${{ github.sha }}
    steps:
      - name: Require the exact dispatched source
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$CONTEXT_SHA"
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect source, CI and proposed environment policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-hosted-ci-evidence.py
