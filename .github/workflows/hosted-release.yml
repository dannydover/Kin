# LOCAL REVIEW EXAMPLE: no signing, environment or upload can run.
name: Kin hosted release candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: kin-hosted-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected dispatch commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git status --porcelain)"
  tests:
    needs: source
    # The local reusable workflow is taken from this same caller commit.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  signing:
    # BOTH this condition and the script's independent guard are disabled.
    # No environment reference is present; a missing environment can be
    # automatically created without protection. Owner review/configuration and
    # a follow-up change are mandatory before any credential-bearing use.
    if: ${{ false }}
    needs: [source, tests]
    runs-on: xcode-27
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive and export (disabled)
        timeout-minutes: 40
        env:
          P12_BASE64: ${{ secrets.KIN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.KIN_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.KIN_PROFILE_BASE64 }}
          TEAM_ID: ${{ vars.KIN_TEAM_ID }}
          PROFILE_UUID: ${{ vars.KIN_PROFILE_UUID }}
          VERSION: ${{ vars.KIN_VERSION }}
          BUILD: ${{ vars.KIN_BUILD }}
          CERT_SHA256: ${{ vars.KIN_CERT_SHA256 }}
        run: bash scripts/kin-sign-export.sh
      - name: Cleanup (disabled)
        if: always()
        timeout-minutes: 5
        env:
          PROFILE_UUID: ${{ vars.KIN_PROFILE_UUID }}
        run: bash scripts/kin-sign-cleanup.sh
