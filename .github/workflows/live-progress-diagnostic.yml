name: Synthetic live progress diagnostic (not release validation)
on:
  push:
    branches: [diagnostic/live-progress]
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        mode: [ui2, friend]
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bounded diagnostic with sanitized progress
        run: python3 scripts/diagnose-live-progress.py ${{ matrix.mode }}
      - name: Retain progress and any finalized synthetic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-progress-${{ matrix.mode }}
          path: ${{ runner.temp }}/KinLiveProgress/public/
          retention-days: 7
          if-no-files-found: error
