name: Build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-validation:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Identity regression tests compare the frozen production baseline.
          fetch-depth: 0
      - name: Verify toolchain
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          xcrun swift --version | grep -F 'Apple Swift version 6.4'
          test "$(uname -m)" = arm64
      - name: Repository privacy and script tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check-repository.py
      - name: Simulator-free Swift Core tests
        run: scripts/test-core.sh
  # Retain the required check name and fail if the prerequisite is skipped or fails.
  validate:
    needs: [core-validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require core validation
        run: test "${{ needs.core-validation.result }}" = success
