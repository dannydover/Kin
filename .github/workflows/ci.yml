name: Build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-validation:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Identity regression tests compare the frozen production baseline.
          fetch-depth: 0
      - name: Verify toolchain and simulator runtime
        run: |
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          xcrun swift --version | grep -F 'Apple Swift version 6.4'
          test "$(uname -m)" = arm64
      - name: Repository privacy guard
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check-repository.py
      - name: Core tests
        run: scripts/test-core.sh
  simulator-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, ui-0, ui-1, ui-2, ui-3]
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify test toolchain
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          xcrun swift --version | grep -F 'Apple Swift version 6.4'
          test "$(uname -m)" = arm64
      - name: Create isolated iOS 27 simulator
        run: |
          KIN_CI_SIMULATOR=$(xcrun simctl create "Kin CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "KIN_CI_SIMULATOR=$KIN_CI_SIMULATOR" >> "$GITHUB_ENV"
          export KIN_CI_SIMULATOR
          xcrun simctl boot "$KIN_CI_SIMULATOR"
          xcrun simctl bootstatus "$KIN_CI_SIMULATOR" -b
          # Only the UI test runner seeds synthetic Contacts; Kin itself retains
          # selection-only picker access without an address-book permission.
          if [ "${{ matrix.shard }}" != "unit" ]; then
            python3 scripts/ci-simulator.py grant
          fi
          python3 scripts/create-simulator-photo.py "$RUNNER_TEMP/KinSyntheticPhoto.png"
          xcrun simctl addmedia "$KIN_CI_SIMULATOR" "$RUNNER_TEMP/KinSyntheticPhoto.png"
      - name: Unit, integration, and UI regression suite (iOS 27)
        timeout-minutes: 45
        run: python3 scripts/ci-observe.py "${{ matrix.shard }}"
      - name: Require finalized results with full fixture coverage
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/KinTests.xcresult" > "$RUNNER_TEMP/KinTests-summary.json"
          python3 scripts/check-test-results.py "$RUNNER_TEMP/KinTests-summary.json"
          if [ "${{ matrix.shard }}" = unit ]; then
            python3 scripts/ci-test-shards.py unit "$RUNNER_TEMP/KinTests-summary.json"
          else
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/KinTests.xcresult" > "$RUNNER_TEMP/KinTests-test-tree.json"
            python3 scripts/ci-test-shards.py "${{ matrix.shard }}" "$RUNNER_TEMP/KinTests-summary.json" "$RUNNER_TEMP/KinTests-test-tree.json"
          fi
      - name: Package synthetic progress and finalized result
        if: always()
        run: python3 scripts/ci-retain.py
      - name: Retain synthetic progress and finalized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kin-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/KinCI-retained/
          retention-days: 7
          if-no-files-found: error
      - name: Remove this run's isolated simulator
        if: always()
        run: |
          if [ -n "${KIN_CI_SIMULATOR:-}" ]; then
            python3 scripts/ci-simulator.py cleanup
          fi
      - name: Retain synthetic cleanup outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kin-cleanup-${{ matrix.shard }}
          path: ${{ runner.temp }}/KinTests-cleanup.json
          retention-days: 7
          if-no-files-found: warn
  # One bounded, PR-only diagnostic; results remain visible but do not alter validate.
  ui-comparison-eight:
    # Wait for the four-group wave to finish, even on failure, to limit contention.
    needs: [simulator-tests]
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.head_ref == 'feature/kin-1.3-ci-comparison' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        shard: [ui-0, ui-1, ui-2, ui-3, ui-4, ui-5, ui-6, ui-7]
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      KIN_UI_SHARD_COUNT: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify test toolchain
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          xcrun swift --version | grep -F 'Apple Swift version 6.4'
          test "$(uname -m)" = arm64
      - name: Create isolated iOS 27 simulator
        run: |
          KIN_CI_SIMULATOR=$(xcrun simctl create "Kin CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "KIN_CI_SIMULATOR=$KIN_CI_SIMULATOR" >> "$GITHUB_ENV"
          export KIN_CI_SIMULATOR
          xcrun simctl boot "$KIN_CI_SIMULATOR"
          xcrun simctl bootstatus "$KIN_CI_SIMULATOR" -b
          # Only the UI test runner seeds synthetic Contacts; Kin itself retains
          # selection-only picker access without an address-book permission.
          if [ "${{ matrix.shard }}" != "unit" ]; then
            python3 scripts/ci-simulator.py grant
          fi
          python3 scripts/create-simulator-photo.py "$RUNNER_TEMP/KinSyntheticPhoto.png"
          xcrun simctl addmedia "$KIN_CI_SIMULATOR" "$RUNNER_TEMP/KinSyntheticPhoto.png"
      - name: Unit, integration, and UI regression suite (iOS 27)
        timeout-minutes: 45
        run: python3 scripts/ci-observe.py "${{ matrix.shard }}"
      - name: Require finalized results with full fixture coverage
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/KinTests.xcresult" > "$RUNNER_TEMP/KinTests-summary.json"
          python3 scripts/check-test-results.py "$RUNNER_TEMP/KinTests-summary.json"
          if [ "${{ matrix.shard }}" = unit ]; then
            python3 scripts/ci-test-shards.py unit "$RUNNER_TEMP/KinTests-summary.json"
          else
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/KinTests.xcresult" > "$RUNNER_TEMP/KinTests-test-tree.json"
            python3 scripts/ci-test-shards.py "${{ matrix.shard }}" "$RUNNER_TEMP/KinTests-summary.json" "$RUNNER_TEMP/KinTests-test-tree.json"
          fi
      - name: Package synthetic progress and finalized result
        if: always()
        run: python3 scripts/ci-retain.py
      - name: Retain synthetic progress and finalized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kin-comparison-eight-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/KinCI-retained/
          retention-days: 7
          if-no-files-found: error
      - name: Remove this run's isolated simulator
        if: always()
        run: |
          if [ -n "${KIN_CI_SIMULATOR:-}" ]; then
            python3 scripts/ci-simulator.py cleanup
          fi
      - name: Retain synthetic cleanup outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kin-comparison-eight-cleanup-${{ matrix.shard }}
          path: ${{ runner.temp }}/KinTests-cleanup.json
          retention-days: 7
          if-no-files-found: warn
  release-validation:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Release toolchain
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          xcrun swift --version | grep -F 'Apple Swift version 6.4'
          test "$(uname -m)" = arm64
      - name: Unsigned iPhone Release build
        run: |
          scripts/build-unsigned-device.sh
          python3 scripts/check-release.py DerivedData/Build/Products/Release-iphoneos/Kin.app
      - name: Unsigned simulator Release build
        run: >-
          xcodebuild -project Kin.xcodeproj -scheme Kin
          -destination 'generic/platform=iOS Simulator'
          -configuration Release -derivedDataPath DerivedData
          build CODE_SIGNING_ALLOWED=NO DEPLOYMENT_POSTPROCESSING=YES
          STRIP_INSTALLED_PRODUCT=YES STRIP_STYLE=debugging
      - name: Validate simulator Release app
        run: python3 scripts/check-release.py DerivedData/Build/Products/Release-iphonesimulator/Kin.app
  # Keep the existing required check, and require every independent job to finish.
  # Completed assertions alone never turn a hung/cancelled xcodebuild into success.
  validate:
    needs: [core-validation, simulator-tests, release-validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        run: |
          test "${{ needs.core-validation.result }}" = success
          test "${{ needs.simulator-tests.result }}" = success
          test "${{ needs.release-validation.result }}" = success
