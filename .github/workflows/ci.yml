name: Temporary synthetic Edit diagnostic
on:
  push:
    branches: [diagnostic/edit-identity-20261016]
permissions:
  contents: read
concurrency:
  group: edit-identity-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-edit-diagnostic:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify matching toolchain and repository privacy
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          test "$(uname -m)" = arm64
          python3 scripts/check-repository.py
      - name: Create this diagnostic's isolated synthetic simulator
        run: |
          KIN_EDIT_SIMULATOR=$(xcrun simctl create "Kin Edit diagnostic ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "KIN_EDIT_SIMULATOR=$KIN_EDIT_SIMULATOR" >> "$GITHUB_ENV"
          xcrun simctl boot "$KIN_EDIT_SIMULATOR"
          xcrun simctl bootstatus "$KIN_EDIT_SIMULATOR" -b
      - name: Compare broad query, strict candidate, and inherited action
        timeout-minutes: 15
        run: |
          xcodebuild -project Kin.xcodeproj -scheme Kin \
            -destination "platform=iOS Simulator,id=$KIN_EDIT_SIMULATOR" \
            -derivedDataPath DerivedData \
            -resultBundlePath "$RUNNER_TEMP/EditIdentity.xcresult" \
            -only-testing:KinUITests/EditIdentityDiagnosticTests \
            -test-iterations 3 -parallel-testing-enabled NO \
            -collect-test-diagnostics never -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 600 \
            test CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/EditIdentity-build.log" 2>&1
      - name: Export and privacy-check explicit synthetic evidence
        id: synthetic-evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/EditIdentity.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/EditIdentity.xcresult" --output-path "$RUNNER_TEMP/EditIdentity-export" > "$RUNNER_TEMP/EditIdentity-export.log" 2>&1
          fi
          python3 scripts/prepare-edit-diagnostic-artifact.py "$RUNNER_TEMP/EditIdentity-build.log" "$RUNNER_TEMP/EditIdentity-export" "$RUNNER_TEMP/EditIdentity-reviewed"
      - name: Retain reviewed synthetic screenshots and control observations
        if: always() && steps.synthetic-evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-edit-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/EditIdentity-reviewed/
          if-no-files-found: error
          retention-days: 3
      - name: Remove only this diagnostic's simulator
        if: always()
        run: |
          if [ -n "${KIN_EDIT_SIMULATOR:-}" ]; then
            xcrun simctl shutdown "$KIN_EDIT_SIMULATOR" || true
            xcrun simctl delete "$KIN_EDIT_SIMULATOR"
          fi
