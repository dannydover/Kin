name: Temporary synthetic Edit diagnostic
on:
  push:
    branches: [diagnostic/edit-identity-20261016]
permissions:
  contents: read
concurrency:
  group: edit-identity-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-edit-diagnostic:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify matching toolchain and repository privacy
        run: |
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -version | grep -Fx 'Build version 27A266a'
          test "$(uname -m)" = arm64
          python3 scripts/check-repository.py
      - name: Create this diagnostic's isolated synthetic simulator
        run: |
          KIN_EDIT_SIMULATOR=$(xcrun simctl create "Kin Edit diagnostic ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "KIN_EDIT_SIMULATOR=$KIN_EDIT_SIMULATOR" >> "$GITHUB_ENV"
          xcrun simctl boot "$KIN_EDIT_SIMULATOR"
          xcrun simctl bootstatus "$KIN_EDIT_SIMULATOR" -b
      - name: Bounded build with safe live progress
        id: build
        continue-on-error: true
        timeout-minutes: 6
        run: python3 scripts/run-edit-diagnostic.py build "$KIN_EDIT_SIMULATOR" "$RUNNER_TEMP/EditIdentity/build"
      - name: Single bounded baseline probe
        id: baseline
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        run: python3 scripts/run-edit-diagnostic.py baseline "$KIN_EDIT_SIMULATOR" "$RUNNER_TEMP/EditIdentity/baseline"
      - name: Single bounded inherited-action observer
        id: observe
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        run: python3 scripts/run-edit-diagnostic.py observe "$KIN_EDIT_SIMULATOR" "$RUNNER_TEMP/EditIdentity/observe"
      - name: Retain safe partial evidence even after a timeout
        id: partial
        if: always()
        run: python3 scripts/run-edit-diagnostic.py collect "${KIN_EDIT_SIMULATOR:-}" "$RUNNER_TEMP/EditIdentity"
      - name: Upload only filtered synthetic evidence and status
        if: always() && steps.partial.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-edit-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EditIdentity/*/reviewed/
            ${{ runner.temp }}/EditIdentity/summary.json
          if-no-files-found: error
          retention-days: 3
      - name: Require every diagnostic phase to finish normally
        if: always()
        run: |
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.baseline.outcome }}' = success
          test '${{ steps.observe.outcome }}' = success
          test '${{ steps.partial.outcome }}' = success
      - name: Remove only this diagnostic's simulator
        if: always()
        run: |
          if [ -n "${KIN_EDIT_SIMULATOR:-}" ]; then
            xcrun simctl shutdown "$KIN_EDIT_SIMULATOR" || true
            xcrun simctl delete "$KIN_EDIT_SIMULATOR"
          fi
