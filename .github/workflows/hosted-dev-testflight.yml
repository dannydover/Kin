# REVIEW CANDIDATE: the protected job can run on an approved main dispatch;
# signing and cleanup scripts remain guarded and upload is disabled.
name: Kin Dev hosted TestFlight review
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit SHA
        required: true
        type: string
      mode:
        description: Separately approved signing-only or upload trial
        required: true
        type: choice
        options: [signing_only, upload_trial]
permissions:
  contents: read
concurrency:
  group: kin-hosted-dev-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected dispatch commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRIAL_MODE: ${{ inputs.mode }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$TRIAL_MODE" = signing_only
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git status --porcelain)"
  tests:
    needs: source
    # The local reusable workflow is taken from this same caller commit.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  signing-preflight:
    if: ${{ inputs.mode == 'signing_only' }}
    needs: [source, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the existing signing environment without secrets
        timeout-minutes: 1
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 scripts/check-signing-environment.py
  signing:
    # REVIEW CANDIDATE ONLY: activate only after environment and runner verification.
    # Upload remains independently disabled and requires separate approval.
    if: ${{ inputs.mode == 'signing_only' }}
    needs: [source, tests, signing-preflight]
    environment: kin-dev-signing
    runs-on: xcode-27
    # 5 checkout + 1 preflight + 40 signing + 20 upload + 5 cleanup + 5 evidence + 10 slack.
    # This reserves time under normal step deadlines, not runner loss or cancellation.
    timeout-minutes: 86
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      KIN_DEV_SIGNING_ONLY: '1'
      PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck environment before secret-bearing step
        timeout-minutes: 1
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 scripts/check-signing-environment.py
      - name: Archive and verify Kin Dev (disabled)
        id: dev_archive
        timeout-minutes: 40
        env:
          P12_BASE64: ${{ secrets.KIN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.KIN_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.KIN_PROFILE_BASE64 }}
          TEAM_ID: ${{ vars.KIN_TEAM_ID }}
          PROFILE_UUID: ${{ vars.KIN_PROFILE_UUID }}
          VERSION: ${{ vars.KIN_VERSION }}
          BUILD: ${{ vars.KIN_BUILD }}
          CERT_SHA256: ${{ vars.KIN_CERT_SHA256 }}
        run: bash scripts/kin-sign-dev-review.sh
      - name: Upload and check processing (disabled)
        if: ${{ false && inputs.mode == 'upload_trial' }}
        timeout-minutes: 20
        env:
          VERSION: ${{ vars.KIN_VERSION }}
          BUILD: ${{ vars.KIN_BUILD }}
          KIN_ASC_KEY_ID: ${{ vars.KIN_ASC_KEY_ID }}
          KIN_ASC_ISSUER_ID: ${{ vars.KIN_ASC_ISSUER_ID }}
          KIN_ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.KIN_ASC_PRIVATE_KEY_P8_BASE64 }}
        run: bash scripts/kin-upload-dev-review.sh
      - name: Cleanup (disabled)
        if: ${{ always() && steps.dev_archive.outcome != 'skipped' && steps.dev_archive.outcome != '' }}
        timeout-minutes: 5
        env:
          PROFILE_UUID: ${{ vars.KIN_PROFILE_UUID }}
        run: bash scripts/kin-sign-dev-cleanup.sh
      - name: Create fixed-field outcome evidence (disabled)
        if: ${{ always() && inputs.mode == 'upload_trial' }}
        timeout-minutes: 2
        env:
          VERSION: ${{ vars.KIN_VERSION }}
          BUILD: ${{ vars.KIN_BUILD }}
        run: python3 scripts/summarize_upload_review.py
      - name: Retain fixed-field outcome evidence (disabled)
        if: ${{ always() && inputs.mode == 'upload_trial' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kin-dev-upload-outcome-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kin-upload-outcome.json
          retention-days: 7
          if-no-files-found: error
