name: Picker transition A-B diagnostic (not release validation)
on:
  push:
    branches: [diagnostic/kin-picker-transition-ab]
permissions:
  contents: read
concurrency:
  group: kin-picker-transition-ab
  cancel-in-progress: false
jobs:
  picker-diagnostic:
    if: github.repository == 'dannydover/Kin'
    strategy:
      fail-fast: false
      matrix:
        variant: [control, deferred]
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      KIN_PICKER_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original UI-2 prefix with filtered native-service events
        timeout-minutes: 45
        run: python3 scripts/diagnose-picker.py
      - name: Retain only sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picker-transition-ab-${{ matrix.variant }}
          path: ${{ runner.temp }}/KinPickerDiagnostic/public/
          retention-days: 7
          if-no-files-found: error
