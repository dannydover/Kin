name: Synthetic post-failure Photos diagnostic (not release validation)
on:
  push:
    branches: [diagnostic/photo-postfailure]
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        mode: [ui2]
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bounded diagnostic with sanitized progress
        timeout-minutes: 65
        run: python3 scripts/diagnose-photo-postfailure.py ${{ matrix.mode }}
      - name: Retain progress and any finalized synthetic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-postfailure-${{ matrix.mode }}
          path: ${{ runner.temp }}/KinUI1Hypotheses/public/
          retention-days: 7
          if-no-files-found: error
